<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Completo Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        
        /* Interfaz de la historia */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            transition: opacity 1s ease;
        }
        .card {
            background: rgba(0,0,0,0.85); color: #fff;
            padding: 30px; border-radius: 10px; text-align: center; max-width: 500px;
        }
        .btn-start {
            background: #ff9900; color: #000; border: none;
            padding: 12px 24px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .hidden { opacity: 0; pointer-events: none; }
    </style>

    <!-- Three.js y Cargadores -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- INTERFAZ Y NARRATIVA -->
    <div id="ui-layer">
        <div class="card">
            <h1>Capítulo 1: El Despertar</h1>
            <p>Has llegado a las costas de la isla desconocida...</p>
            <button class="btn-start" onclick="iniciarAventura()">Explorar</button>
        </div>
    </div>

    <script>
        // --- 1. VARIABLES GLOBALES DE ESTADO ---
        let scene, camera, renderer, controls;
        let loaderGLTF;
        let enJuego = false;

        // Objetos interactivos o guardados
        const objetosEscena = {};

        // --- 2. INICIALIZACIÓN DE LA ESCENA 3D ---
        function initEscena() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510); // Color nocturno de fondo

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Activar sombras
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            loaderGLTF = new THREE.GLTFLoader();

            // Llamar a los submódulos que hemos creado en los demás prompts:
            crearIluminacion();
            crearTerreno();
            cargarModelos3D();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // --- 3. MÓDULO DE ILUMINACIÓN ---
        function crearIluminacion() {
            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(luzAmbiente);

            const luzSol = new THREE.DirectionalLight(0xffa500, 1);
            luzSol.position.set(20, 40, 20);
            luzSol.castShadow = true;
            scene.add(luzSol);
        }

        // --- 4. MÓDULO DE TERRENO ---
        function crearTerreno() {
            const sueloGeo = new THREE.PlaneGeometry(100, 100);
            const sueloMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e, roughness: 0.8 });
            const suelo = new THREE.Mesh(sueloGeo, sueloMat);
            suelo.rotation.x = -Math.PI / 2;
            suelo.receiveShadow = true;
            scene.add(suelo);
        }

        // --- 5. CARGA DE MODELOS (Mallas y Asset Pack) ---
        function cargarModelos3D() {
            // Ejemplo para agregar objetos simples mientras cargan los modelos
            const cofreGeo = new THREE.BoxGeometry(1, 1, 1);
            const cofreMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const cofre = new THREE.Mesh(cofreGeo, cofreMat);
            cofre.position.set(0, 0.5, 0);
            cofre.castShadow = true;
            scene.add(cofre);
            objetosEscena.cofre = cofre;

            /*
            // Cargar archivo GLTF/GLB real cuando tengas la ruta:
            loaderGLTF.load('modelos/barco.glb', (gltf) => {
                const modelo = gltf.scene;
                modelo.position.set(-10, 0, -5);
                scene.add(modelo);
            });
            */
        }

        // --- 6. TRANSICIÓN DE INTERFAZ A JUEGO ---
        function iniciarAventura() {
            const ui = document.getElementById('ui-layer');
            ui.classList.add('hidden');
            enJuego = true;

            // Animación de cámara inicial para entrar a la escena
            gsapCameraAnim();
        }

        function gsapCameraAnim() {
            // Movimiento fluido de la cámara al iniciar
            let inicio = Date.now();
            function mover() {
                let transcurrido = (Date.now() - inicio) / 1000;
                if (transcurrido < 2) {
                    camera.position.z = 15 - transcurrido * 2;
                    requestAnimationFrame(mover);
                }
            }
            mover();
        }

        // --- 7. BUCLE PRINCIPAL DE ANIMACIÓN Y LÓGICA ---
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar controles de cámara
            controls.update();

            // Rotaciones o animaciones de los objetos agregados
            if (enJuego && objetosEscena.cofre) {
                objetosEscena.cofre.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Arrancar la escena base
        initEscena();
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Isla del Tesoro - Escenario Principal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
    <!-- Módulos de Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
         Usa el clic izquierdo para rotar la cámara y la rueda para hacer zoom.
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DE LA ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Cielo azul claro
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015); // Niebla suave de ambiente

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evita atravesar el suelo

        // --- 2. ILUMINACIÓN ---
        // Luz ambiental suave
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Luz solar (Direccional con sombras)
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        // --- 3. CREACIÓN DEL MAR ---
        const oceanGeo = new THREE.PlaneGeometry(300, 300);
        const oceanMat = new THREE.MeshStandardMaterial({
            color: 0x006699,
            roughness: 0.1,
            metalness: 0.8,
            transparent: true,
            opacity: 0.8
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -0.2;
        scene.add(ocean);

        // --- 4. CREACIÓN DE LA ISLA (TERRENO PROCESAL) ---
        const islandGeo = new THREE.CylinderGeometry(15, 25, 4, 32);
        const islandMat = new THREE.MeshStandardMaterial({
            color: 0x2e8b57, // Verde vegetación
            roughness: 0.9
        });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = 1;
        island.receiveShadow = true;
        island.castShadow = true;
        scene.add(island);

        // Playa de arena alrededor
        const beachGeo = new THREE.CylinderGeometry(20, 28, 1, 32);
        const beachMat = new THREE.MeshStandardMaterial({
            color: 0xe3c878, // Color arena
            roughness: 1.0
        });
        const beach = new THREE.Mesh(beachGeo, beachMat);
        beach.position.y = 0.2;
        beach.receiveShadow = true;
        scene.add(beach);

        // --- 5. BARCO NAUFRAGADO (OBJETO COMPUESTO) ---
        const boatGroup = new THREE.Group();

        // Casco del barco
        const hullGeo = new THREE.BoxGeometry(3, 2, 7);
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
        const hull = new THREE.Mesh(hullGeo, woodMat);
        hull.castShadow = true;
        boatGroup.add(hull);

        // Mástil roto
        const mastGeo = new THREE.CylinderGeometry(0.15, 0.15, 6);
        const mast = new THREE.Mesh(mastGeo, woodMat);
        mast.position.set(0, 3, 0);
        mast.rotation.z = -0.3; // Mástil inclinado por el naufragio
        mast.castShadow = true;
        boatGroup.add(mast);

        // Posicionar el barco semihundido cerca de la orilla
        boatGroup.position.set(-16, 0.5, 8);
        boatGroup.rotation.set(0.2, 0.8, -0.2); // Inclinación en la arena
        scene.add(boatGroup);

        // --- 6. COFRE DEL TESORO EN LA ISLA ---
        const chestGroup = new THREE.Group();
        const chestBaseGeo = new THREE.BoxGeometry(1.2, 0.8, 0.8);
        const chestMat = new THREE.MeshStandardMaterial({ color: 0x4a2e10 });
        const chestBase = new THREE.Mesh(chestBaseGeo, chestMat);
        chestBase.castShadow = true;
        chestGroup.add(chestBase);

        // Tapa del cofre
        const chestLidGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16, 1, false, 0, Math.PI);
        const chestLidMat = new THREE.MeshStandardMaterial({ color: 0x3d250d });
        const chestLid = new THREE.Mesh(chestLidGeo, chestLidMat);
        chestLid.rotation.z = Math.PI / 2;
        chestLid.position.y = 0.4;
        chestLid.castShadow = true;
        chestGroup.add(chestLid);

        // Posicionar cofre en el centro de la isla
        chestGroup.position.set(2, 3.4, -2);
        scene.add(chestGroup);

        // --- 7. BUCLE DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            // Efecto suave de oleaje en el mar
            ocean.position.y = -0.2 + Math.sin(Date.now() * 0.0015) * 0.1;

            controls.update();
            renderer.render(scene, camera);
        }

        // Ajuste de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
